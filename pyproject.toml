[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steadfast-llm"
dynamic = ["version"]  # read from steadfast/__init__.py
description = "A reliability layer for LLM API calls: retries, rate limiting, validation, tool calling, fallbacks, and structured logging."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Manish Pandeya" }]
keywords = ["llm", "openai", "anthropic", "groq", "retry", "rate-limit", "pydantic", "tool-calling", "reliability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = [
    "tenacity>=9.2.1",
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
    "aiolimiter>=1.2.1",
]

[project.optional-dependencies]
openai = ["openai>=1.55.3"]
groq = ["groq>=0.13.0"]
anthropic = ["anthropic>=0.40.0"]
providers = [
    "openai>=1.55.3",
    "groq>=0.13.0",
    "anthropic>=0.40.0",
]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=5.0.0",
    "python-dotenv>=1.0.1",
    "ruff>=0.8.0",
    "build>=1.2.0",
    "twine>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/maniesh-lab/steadfast"
Repository = "https://github.com/maniesh-lab/steadfast"
Issues = "https://github.com/maniesh-lab/steadfast/issues"
Changelog = "https://github.com/maniesh-lab/steadfast/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "steadfast.__version__" }

[tool.setuptools.packages.find]
include = ["steadfast*"]

[tool.setuptools.package-data]
steadfast = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP"]
