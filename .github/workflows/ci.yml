name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with all providers and dev tools
        run: pip install -e ".[providers,dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q --cov=steadfast --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        # One upload is enough; the Python versions run the same tests.
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build package
        run: python -m build

  lowest-versions:
    # Installs the oldest version of every dependency that pyproject.toml
    # allows, so the minimum versions it claims are actually tested.
    name: test (oldest allowed dependencies)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Install oldest allowed versions
        run: |
          uv venv -p 3.10
          uv pip install --resolution lowest-direct -e ".[providers,dev]"

      - name: Test
        run: uv run --no-sync pytest -q
